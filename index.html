<!DOCTYPE html>
  <html lang="en">
  <head>
      <meta charset="UTF-8">
      <title>UPSC OS - Stealth Edition</title>
      <style>
          body { background-color: #0f172a; color: #f1f5f9; font-family: sans-serif; margin: 0; display: flex;
  height: 100vh; overflow: hidden; }
          .sidebar { width: 240px; background-color: #1e293b; border-right: 1px solid #334155; display: flex;
  flex-direction: column; }
          .sidebar-header { padding: 20px; border-bottom: 1px solid #334155; font-size: 20px; font-weight: bold;
  color: #60a5fa; }
          .nav-container { flex: 1; padding: 20px 10px; }
          .nav-btn { background: transparent; color: #cbd5e1; padding: 10px; border: none; border-radius: 8px;
  cursor: pointer; margin-bottom: 5px; display: block; width: 100%; text-align: left; transition: 0.2s; }
          .nav-btn:hover { background: #334155; color: white; }
          .nav-btn.active { background: #3b82f6; color: white; }
          .main-content { flex: 1; display: flex; flex-direction: column; }
          .top-bar { height: 60px; background-color: #1e293b; border-bottom: 1px solid #334155; display: flex;
  align-items: center; justify-content: space-between; padding: 0 20px; }
          .content-area { flex: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column;
  align-items: center; }
          .card { background-color: #1e293b; padding: 20px; border-radius: 15px; border: 1px solid #334155; width:
  100%; max-width: 500px; }
          .goal-item { background: #0f172a; padding: 10px; border-radius: 8px; margin-bottom: 10px; display: flex;
  justify-content: space-between; border: 1px solid #334155; }
          .btn { background: #3b82f6; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor:
  pointer; font-weight: bold; }
          .input-group { display: flex; gap: 10px; margin-bottom: 15px; }
          .input-group input { background: #0f172a; border: 1px solid #334155; color: white; padding: 8px;
  border-radius: 5px; flex: 1; }
      </style>
  </head>
  <body>
      <div class="sidebar">
          <div class="sidebar-header">🚀 UPSC OS</div>
          <div class="nav-container">
              <button id="btn-dash" class="nav-btn active">🏠 Dashboard</button>
              <button id="btn-pdf" class="nav-btn">📚 PDF Vault</button>
              <button id="btn-atlas" class="nav-btn">🗺️ Atlas</button>
              <button id="btn-pyq" class="nav-btn">📝 PYQs</button>
          </div>
      </div>
      <div class="main-content">
          <div class="top-bar">
              <div id="tab-title" style="font-weight: bold;">DASHBOARD</div>
              <div id="timer-display" style="font-family: monospace; background:#0f172a; padding:5px 10px;
  border-radius:15px; border:1px solid #3b82f6;">25:00</div>
          </div>
          <div class="content-area" id="screen"></div>
      </div>

      <script>
          window.onload = function() {
              var state = {
                  tab: 'dashboard',
                  tasks: [{ id: 1, text: 'Welcome to the Hub!', done: false, time: 'Now' }],
                  pdfs: { 'History': [], 'Polity': [], 'Geography': [], 'Economy': [] }
              };

              function render() {
                  var screen = document.getElementById('screen');
                  var title = document.getElementById('tab-title');
                  title.innerText = state.tab.toUpperCase();

                  if(state.tab === 'dashboard') {
                      var html = '<h1 style="color:#60a5fa; text-align:center;">Welcome, Aspirant</h1>';
                      html += '<div class="card"><h3>🎯 Daily Goals</h3>';
                      html += '<div class="input-group"><input id="tIn" placeholder="Goal..."><input id="tmIn"
  placeholder="Time"><button id="addB" class="btn">+</button></div>';
                      html += '<div id="list">';
                      state.tasks.forEach(function(t) {
                          html += '<div class="goal-item"><div style="display:flex; align-items:center;"><input
  type="checkbox" class="t-check" data-id="' + t.id + '" ' + (t.done?'checked':'') + '> ' + t.text + '</div><span>' +
  t.time + '</span></div>';
                      });
                      html += '</div></div>';
                      screen.innerHTML = html;

                      document.getElementById('addB').onclick = function() {
                          var tx = document.getElementById('tIn').value;
                          var tm = document.getElementById('tmIn').value;
                          if(tx) { state.tasks.push({ id: Date.now(), text: tx, done: false, time: tm || 'N/A' });
  render(); }
                      };
                      document.querySelectorAll('.t-check').forEach(function(cb) {
                          cb.onclick = function() {
                              var id = parseInt(this.getAttribute('data-id'));
                              state.tasks.forEach(function(t) { if(t.id === id) t.done = !t.done; });
                              render();
                          };
                      });
                  } else if(state.tab === 'pdf') {
                      var html = '<h2 style="color:#60a5fa; text-align:center;">📚 PDF Vault</h2><div
  style="display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; width:100%; max-width:400px;">';
                      Object.keys(state.pdfs).forEach(function(cat) {
                          html += '<div class="card" style="text-align:center; cursor:pointer;" id="f-'+cat+'">📁 ' +
  cat + '</div>';
                      });
                      html += '</div>';
                      screen.innerHTML = html;

                      Object.keys(state.pdfs).forEach(function(cat) {
                          document.getElementById('f-'+cat).onclick = function() { openFolder(cat); };
                      });
                  } else {
                      screen.innerHTML = '<div class="card" style="text-align:center"><h2>' + state.tab.toUpperCase()
  + '</h2><p>Coming Soon...</p></div>';
                  }
              }

              function openFolder(cat) {
                  var screen = document.getElementById('screen');
                  var pdfs = state.pdfs[cat];
                  var html = '<button id="backB" class="btn" style="background:#334155; margin-bottom:20px;">⬅
  Back</button>';
                  html += '<h2 style="text-align:center; color:#60a5fa;">' + cat + '</h2>';
                  html += '<div class="input-group"><input id="pn" placeholder="Name"><input id="pl"
  placeholder="Link"><button id="pAdd" class="btn">+</button></div>';
                  html += '<div class="card" style="text-align:left;">';
                  pdfs.forEach(function(p) {
                      html += '<div class="goal-item"><span>📄 ' + p.name + '</span><a href="' + p.link + '"
  target="_blank" style="color:#60a5fa; text-decoration:none;">Open</a></div>';
                  });
                  html += '</div>';
                  screen.innerHTML = html;

                  document.getElementById('backB').onclick = function() { state.tab = 'pdf'; render(); };
                  document.getElementById('pAdd').onclick = function() {
                      var n = document.getElementById('pn').value;
                      var l = document.getElementById('pl').value;
                      if(n) { state.pdfs[cat].push({ name: n, link: l || '#' }); openFolder(cat); }
                  };
              }

              document.getElementById('btn-dash').onclick = function() { state.tab = 'dashboard'; render(); };
              document.getElementById('btn-pdf').onclick = function() { state.tab = 'pdf'; render(); };
              document.getElementById('btn-atlas').onclick = function() { state.tab = 'atlas'; render(); };
              document.getElementById('btn-pyq').onclick = function() { state.tab = 'pyq'; render(); };

              render();
          };
      </script>
  </body>
  </html>
